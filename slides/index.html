<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentations · Tradeoff Lab</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0F172A;color:#F8FAFC}
    body{max-width:1100px;margin:0 auto;padding:clamp(24px,7vw,84px)}
    h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.04em;margin:12px 0}
    p{color:#94A3B8;margin:0 0 48px}
    .eyebrow{font-size:13px;letter-spacing:.2em;color:#38BDF8;text-transform:uppercase}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
    .deck{display:flex;flex-direction:column;min-height:150px;gap:12px;padding:26px;border:1px solid #334155;border-radius:18px;background:#1E293B;color:inherit;text-decoration:none}
    .deck:hover,.deck:focus-visible{border-color:#38BDF8;outline:none}
    .deck span{color:#38BDF8;font-size:13px;text-transform:uppercase;letter-spacing:.15em}
    .deck strong{font-size:26px;line-height:1.2}
    .deck small{margin-top:auto;color:#94A3B8}
  </style>
</head>
<body>
  <div class="eyebrow">Tradeoff Lab</div>
  <h1>Presentations</h1>
  <p>System design, learned and practiced in public.</p>
  <main class="grid">
    <a class="deck" href="/slides/scaling-axes/"><span>Deck</span><strong>Scaling Axes</strong><small>Open presentation →</small></a>
  </main>
</body>
</html>
